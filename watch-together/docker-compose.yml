services:
  app:
    build: .
    container_name: cine-a-dois
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-3100}:3000"
    environment:
      PORT: 3000
      TRUST_PROXY: "1"
      TURN_HOST: ${DOMAIN}
      TURN_PORT: 3478
      TURN_SECRET: ${TURN_SECRET}
      ACCESS_CODE: ${ACCESS_CODE:-}

  # Servidor TURN: garante a conexão quando o 4G/roteador bloqueia ligação direta.
  coturn:
    image: coturn/coturn:4.6
    container_name: cine-a-dois-turn
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --realm=${DOMAIN}
      - --external-ip=${PUBLIC_IP}
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
      - --stale-nonce=600
      - --user-quota=20
      - --total-quota=60
      # não deixa o TURN ser usado para alcançar a rede interna da VPS
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=::1
      - --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
