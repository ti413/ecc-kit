# /etc/nginx/sites-available/cine.conf  (ou dentro do seu /root/stack/nginx.conf)
# Troque cine.campostecnologia.cloud pelo seu subdomínio.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name cine.campostecnologia.cloud;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name cine.campostecnologia.cloud;

    ssl_certificate     /etc/letsencrypt/live/cine.campostecnologia.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cine.campostecnologia.cloud/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Se o Nginx roda em container no mesmo docker-compose/rede, troque
    # 127.0.0.1:3100 por cine-a-dois:3000
    location /ws {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
